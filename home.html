    <script>
        const STORE_KEY = 'milkProducts';
        const ICONS = {
            cow: 'cow-svgrepo-com.svg',
            buffalo: 'water-buffalo-svgrepo-com.svg',
            yogurt: 'yogurt-svgrepo-com.svg',
            lassi: 'lassi.png',
            bread: 'bread-svgrepo-com.svg',
            cheese: 'cheese-wedge-svgrepo-com.svg'
        };

        const DEFAULT_PRODUCTS = [
            { key: 'fullCream', name: 'Full Cream', label: '68', rate: '66.7', actual: '65.88', icon: 'cow' },
            { key: 'toned', name: 'Toned Milk', label: '56', rate: '54.7', actual: '53.99', icon: 'cow' },
            { key: 'buffalo', name: 'Buffalo Milk', label: '73', rate: '71', actual: '70.05', icon: 'buffalo' },
            { key: 'doubleToned', name: 'Double Toned', label: '50', rate: '48.7', actual: '48.10', icon: 'cow' },
            { key: 'CowMilk', name: 'Cow Milk', label: '58', rate: '56.7', actual: '55.46', icon: 'cow' },
            { key: 'tenWala', name: '10 Wala Milk', label: '10', rate: '9', actual: '8.5', icon: 'cow' },
            { key: 'twelveWala', name: '12 Wala Milk', label: '12', rate: '11', actual: '10.5', icon: 'cow' },
            { key: 'badiDahi', name: 'Badi Dahi', label: '35', rate: '33', actual: '31.89', icon: 'yogurt' },
            { key: 'chotiDahi', name: 'Choti Dahi', label: '19', rate: '18', actual: '17.29', icon: 'yogurt' },
            { key: 'Dahicup', name: 'Dahi Cup Chota', label: '23', rate: '22', actual: '20.59', icon: 'yogurt' },
            { key: 'Dahicupbda', name: 'Dahi Cup Bda', label: '45', rate: '43', actual: '40.28', icon: 'yogurt' },
            { key: 'badiLassi', name: 'Badi Lassi 1kg', label: '30', rate: '29', actual: '28', icon: 'lassi' },
            { key: 'chotilassi', name: 'Choti Lassi 1kg', label: '20', rate: '19', actual: '18.5', icon: 'lassi' },
            { key: 'bread20Wala', name: 'Bread 20 Wala', label: '20', rate: '18', actual: '18', icon: 'bread' },
            { key: 'bread45Wala', name: 'Bread 45 Wala', label: '45', rate: '40', actual: '40', icon: 'bread' },
            { key: 'paneer', name: 'Paneer', label: '91', rate: '78', actual: '77', icon: 'cheese' },
            { key: 'empty1', name: 'Bread 35 Wala', label: '35', rate: '30', actual: '30', icon: 'bread' },
            { key: 'empty2', name: 'Bread 50 Wala', label: '50', rate: '45', actual: '45', icon: 'bread' }
        ];

        let products = [];
        let qtys = {};
        let editing = false;
        let snapshot = null;
        let counter = 0;
        let selectedIcon = 'cow';

        const milkForm = document.getElementById('milkForm');
        const totalDisplay = document.getElementById('total');
        const total2Display = document.getElementById('total2');
        const minusDisplay = document.getElementById('minus');
        const monthDisplay = document.getElementById('month');
        const editBtn = document.getElementById('editBtn');
        const editBanner = document.getElementById('editBanner');
        const resetDefaultsBtn = document.getElementById('resetDefaultsBtn');
        const addMoreBtn = document.getElementById('addMoreBtn');
        const addOverlay = document.getElementById('addOverlay');
        const newName = document.getElementById('newName');
        const iconPicker = document.getElementById('iconPicker');
        const addOk = document.getElementById('addOk');
        const addCancel = document.getElementById('addCancel');

        function uid() { return 'p' + (++counter) + '-' + Date.now().toString(36); }
        function esc(str) {
            return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        function loadProducts() {
            try {
                const raw = localStorage.getItem(STORE_KEY);
                if (raw) {
                    const saved = JSON.parse(raw);
                    if (Array.isArray(saved) && saved.length > 0) {
                        return saved.map(p => ({
                            key: p.key || p.id || uid(),
                            name: p.name || 'New Product',
                            rate: (p.rate !== undefined && p.rate !== null) ? p.rate : '0',
                            actual: (p.actual !== undefined && p.actual !== null) ? p.actual : '0',
                            icon: p.icon || 'cow'
                        }));
                    }
                }
            } catch (e) { /* fall back to defaults */ }
            return DEFAULT_PRODUCTS.map(p => ({ ...p }));
        }

        function saveProducts() {
            try { localStorage.setItem(STORE_KEY, JSON.stringify(products)); }
            catch (e) { console.error('save failed', e); }
        }

        function productByKey(key) { return products.find(p => p.key === key); }

        function render() {
            milkForm.innerHTML = products.map(p => `
                <label for="${p.key}">
                    <img class="imgg" src="${ICONS[p.icon] || ICONS.cow}" alt="">
                    <span class="rate-name" data-key="${p.key}">${esc(p.name)}</span>
                    (₹<span class="rate-edit" data-key="${p.key}" data-field="cost2" title="MRP rate edit karo">${p.actual}</span> =>
                    <span class="rate-edit" data-key="${p.key}" data-field="cost" title="Billing rate edit karo">${p.rate}</span>)
                    <button type="button" class="row-del" data-key="${p.key}" title="Delete">✕</button>
                </label>
                <input type="number" id="${p.key}" class="milkInput" data-cost="${p.rate}" data-cost2="${p.actual}" data-key="${p.key}" value="${qtys[p.key] !== undefined ? qtys[p.key] : ''}">
            `).join('');
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            let total2 = 0;
            milkForm.querySelectorAll('.milkInput').forEach(input => {
                const quantity = input.value ? parseFloat(input.value) : 0;
                const cost = parseFloat(input.dataset.cost || 0);
                const cost2 = parseFloat(input.dataset.cost2 || 0);
                total += quantity * cost;
                total2 += quantity * cost2;
            });

            totalDisplay.textContent = `Total: ₹${total.toFixed(2)}`;
            total2Display.textContent = `Total according to actual rates: ₹${total2.toFixed(2)}`;
            const loss = total - total2;
            minusDisplay.textContent = `₹${loss.toFixed(2)}`;
            minusDisplay.style.color = loss > 0 ? '#dc3545' : '#198754';
            monthDisplay.textContent = `₹${(loss * 30).toFixed(2)}`;
            monthDisplay.style.color = loss > 0 ? '#dc3545' : '#198754';
        }

        milkForm.addEventListener('input', (e) => {
            const inp = e.target.closest('.milkInput');
            if (!inp) return;
            qtys[inp.dataset.key] = inp.value;
            updateTotal();
        });

        milkForm.addEventListener('focusout', (e) => {
            const el = e.target;
            if (!el.isContentEditable) return;
            const key = el.dataset.key;
            const p = productByKey(key);
            if (!p) return;
            if (el.classList.contains('rate-edit')) {
                const val = parseFloat(el.textContent);
                const field = el.dataset.field;
                if (isNaN(val)) { el.textContent = p[field]; return; }
                p[field] = val;
                const input = document.getElementById(key);
                if (input) input.dataset[field] = val;
                updateTotal();
            } else if (el.classList.contains('rate-name')) {
                const name = el.textContent.trim();
                if (name) p.name = name;
                else el.textContent = p.name;
            }
        });

        milkForm.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.target.isContentEditable) {
                e.preventDefault();
                e.target.blur();
            }
        });

        milkForm.addEventListener('click', (e) => {
            const del = e.target.closest('.row-del');
            if (!del) return;
            if (!confirm('Yeh product delete karna hai?')) return;
            products = products.filter(p => p.key !== del.dataset.key);
            render();
        });

        function enterEditing() {
            snapshot = JSON.parse(JSON.stringify(products));
            editing = true;
            document.body.classList.add('editing');
            editBanner.hidden = false;
            editBtn.textContent = '✓ Done Editing';
            editBtn.classList.remove('btn-warning');
            editBtn.classList.add('btn-success');
            milkForm.querySelectorAll('.rate-edit, .rate-name').forEach(el => el.setAttribute('contenteditable', 'true'));
        }

        function exitEditing() {
            editing = false;
            document.body.classList.remove('editing');
            editBanner.hidden = true;
            editBtn.textContent = '✏️ Edit Rates';
            editBtn.classList.add('btn-warning');
            editBtn.classList.remove('btn-success');
            render();
        }

        editBtn.addEventListener('click', () => {
            if (!editing) { enterEditing(); return; }
            const changed = JSON.stringify(products) !== JSON.stringify(snapshot);
            if (changed && !confirm('Changes detected. Save karein?\n\nOK = Save changes\nCancel = wapas purana rates')) {
                products = snapshot;
            } else if (changed) {
                saveProducts();
            }
            exitEditing();
        });

        resetDefaultsBtn.addEventListener('click', () => {
            if (!confirm('Sab products aur rates default par reset karein?')) return;
            products = DEFAULT_PRODUCTS.map(p => ({ ...p }));
            snapshot = JSON.parse(JSON.stringify(products));
            render();
        });

        function buildIconPicker() {
            iconPicker.innerHTML = Object.keys(ICONS).map(key =>
                `<img src="${ICONS[key]}" data-icon="${key}" class="${key === selectedIcon ? 'selected' : ''}" title="${key}">`
            ).join('');
        }
        iconPicker.addEventListener('click', (e) => {
            const img = e.target.closest('img');
            if (!img) return;
            selectedIcon = img.dataset.icon;
            iconPicker.querySelectorAll('img').forEach(i => i.classList.remove('selected'));
            img.classList.add('selected');
        });

        addMoreBtn.addEventListener('click', () => {
            newName.value = '';
            selectedIcon = 'cow';
            buildIconPicker();
            addOverlay.classList.add('show');
            newName.focus();
        });
        addCancel.addEventListener('click', () => addOverlay.classList.remove('show'));
        addOverlay.addEventListener('click', (e) => { if (e.target === addOverlay) addOverlay.classList.remove('show'); });
        newName.addEventListener('keydown', (e) => { if (e.key === 'Enter') addOk.click(); });
        addOk.addEventListener('click', () => {
            const name = newName.value.trim();
            if (!name) { newName.focus(); return; }
            products.push({ key: uid(), name, rate: '0', actual: '0', icon: selectedIcon });
            if (!editing) saveProducts();
            render();
            addOverlay.classList.remove('show');
            milkForm.querySelector('input:last-child').focus();
        });

        const shareBtn = document.getElementById('shareBtn');

        function buildSummary() {
            const lines = [];
            let total = 0;
            milkForm.querySelectorAll('.milkInput').forEach(input => {
                const qty = input.value ? parseFloat(input.value) : 0;
                if (qty <= 0) return;
                const p = productByKey(input.dataset.key);
                if (!p) return;
                const cost = parseFloat(input.dataset.cost || 0);
                const amount = qty * cost;
                total += amount;
                lines.push(`${p.name} : ${qty} = ₹${amount.toFixed(2)}`);
            });
            if (lines.length === 0) return null;
            lines.push(`\nTotal     = ₹${total.toFixed(2)}`);
            return lines.join('\n');
        }

        shareBtn.addEventListener('click', () => {
            const text = buildSummary();
            if (!text) { alert('Kuch quantity daalo pehle!'); return; }
            const msg = `📋 *Milk Order Summary*\n\n${text}`;
            window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
        });

        products = loadProducts();
        render();
    </script>
    
</body>
</html>
