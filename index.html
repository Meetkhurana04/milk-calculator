<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
      *,
      *:before,
      *:after {
          padding: 0;
          margin: 0;
          box-sizing: border-box;
      }
      body {
          background-color: #080710;
          display: flex;
          justify-content: center;
          align-items: center;
          height: 100vh;
          font-family: 'Poppins', sans-serif;
      }
      .background {
          width: 430px;
          height: 520px;
          position: absolute;
          transform: translate(-50%, -50%);
          left: 50%;
          top: 50%;
      }
      .background .shape {
          height: 200px;
          width: 200px;
          position: absolute;
          border-radius: 50%;
      }
      .shape:first-child {
          background: linear-gradient(#1845ad, #23a2f6);
          left: -80px;
          top: -80px;
      }
      .shape:last-child {
          background: linear-gradient(to right, #ff512f, #f09819);
          right: -30px;
          bottom: -80px;
      }
      form {
          height: 520px;
          width: 400px;
          background-color: rgba(255, 255, 255, 0.13);
          position: absolute;
          transform: translate(-50%, -50%);
          top: 50%;
          left: 50%;
          border-radius: 10px;
          backdrop-filter: blur(10px);
          border: 2px solid rgba(255, 255, 255, 0.1);
          box-shadow: 0 0 40px rgba(8, 7, 16, 0.6);
          padding: 50px 35px;
      }
      form * {
          font-family: 'Poppins', sans-serif;
          color: #ffffff;
          letter-spacing: 0.5px;
          outline: none;
          border: none;
      }
      form h3 {
          font-size: 32px;
          font-weight: 500;
          line-height: 42px;
          text-align: center;
      }
      label {
          display: block;
          margin-top: 30px;
          font-size: 16px;
          font-weight: 500;
      }
      input {
          display: block;
          height: 50px;
          width: 100%;
          background-color: rgba(255, 255, 255, 0.07);
          border-radius: 3px;
          padding: 0 10px;
          margin-top: 8px;
          font-size: 14px;
          font-weight: 300;
      }
      ::placeholder {
          color: #e5e5e5;
      }
      button {
          margin-top: 50px;
          width: 100%;
          background-color: #ffffff;
          color: #080710;
          padding: 15px 0;
          font-size: 18px;
          font-weight: 600;
          border-radius: 5px;
          cursor: pointer;
      }
      .social {
          margin-top: 30px;
          display: flex;
      }
      .social div {
          background: red;
          width: 150px;
          border-radius: 3px;
          padding: 5px 10px 10px 5px;
          background-color: rgba(255, 255, 255, 0.27);
          color: #eaf0fb;
          text-align: center;
      }
      .social div:hover {
          background-color: rgba(255, 255, 255, 0.47);
      }
      .social .fb {
          margin-left: 25px;
      }
      .social i {
          margin-right: 4px;
      }
    </style>
</head>
<body>
    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
    <div class="login-container">
        <form id="loginForm">
            <h3>Login Here</h3>
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password" required>
            <button type="submit">Login</button>
            <div class="message" id="message"></div>
        </form>
        <div class="social">
            <div class="go"><i class="fab fa-google"></i> Google</div>
            <div class="fb"><i class="fab fa-facebook"></i> Facebook</div>
        </div>
    </div>
    <div id="appContainer" style="display: none;">
        hello
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const deviceId = "unique-device-id"; // Replace with a unique identifier for each device/user
            const loggedInKey = 'userLoggedIn';
            const isLoggedIn = localStorage.getItem(loggedInKey);

            // If the user is already logged in, redirect to home.html
            if (isLoggedIn) {
                window.location.href = "home.html";
            }

            let passwords = getInitialPasswords();
            function getInitialPasswords() {
                return [
                    { password: "1111", expires: null },
                    { password: "1234", expires: null },
                    { password: "1122", expires: null },
                    { password: "4321", expires: null },
                    { password: "1212", expires: null },
                    { password: "3344", expires: null },
                    { password: "5678", expires: null },
                    { password: "8765", expires: null },
                    { password: "2468", expires: null },
                    { password: "1357", expires: null },
                    { password: "2134", expires: null },
                    { password: "3412", expires: null },
                    { password: "3142", expires: null },
                    { password: "2413", expires: null },
                    { password: "1324", expires: null },
                    { password: "4231", expires: null },
                    { password: "3124", expires: null },
                    { password: "4312", expires: null },
                    { password: "2143", expires: null },
                    { password: "1423", expires: null },
                    { password: "1243", expires: null },
                    { password: "3412", expires: null },
                    { password: "2341", expires: null },
                    { password: "4231", expires: null },
                    { password: "3124", expires: null },
                    { password: "4312", expires: null },
                    { password: "2413", expires: null },
                    { password: "3142", expires: null },
                    { password: "1324", expires: null },
                    { password: "2143", expires: null },
                    { password: "1243", expires: null },
                    { password: "1423", expires: null },
                    { password: "3412", expires: null },
                    { password: "4231", expires: null },
                    { password: "3124", expires: null },
                    { password: "4312", expires: null },
                    { password: "2134", expires: null },
                    { password: "2143", expires: null },
                    { password: "2413", expires: null },
                    { password: "3142", expires: null },
                    { password: "1324", expires: null },
                    { password: "1243", expires: null },
                    { password: "1423", expires: null },
                    { password: "2314", expires: null },
                    { password: "2341", expires: null },
                    { password: "2134", expires: null },
                    { password: "2314", expires: null },
                    { password: "2341", expires: null }
                ];
            }

            console.log("Current passwords:", passwords);

            document.getElementById('loginForm').addEventListener('submit', function(event) {
                event.preventDefault();
                const passwordInput = document.getElementById('password').value;
                const messageDiv = document.getElementById('message');

                console.log("Entered password:", passwordInput);

                const foundPassword = passwords.find(p => p.password === passwordInput && (p.expires === null || p.expires > Date.now()));

                if (foundPassword) {
                    foundPassword.expires = Date.now() + (5 * 60 * 1000); // Set password expiry to 5 minutes from now
                    messageDiv.textContent = "Login successful!";
                    messageDiv.style.color = "green";
                    updatePasswordList();
                    localStorage.setItem(loggedInKey, 'true'); // Set the logged-in flag
                    window.location.href = "home.html"; // Redirect to home.html
                } else {
                    messageDiv.textContent = "Invalid password or password expired.";
                    messageDiv.style.color = "red";
                }

                console.log("Updated passwords:", passwords);
                document.getElementById('password').value = '';
            });

            function updatePasswordList() {
                localStorage.setItem(deviceId, JSON.stringify(passwords));
            }
        });
    </script>
</body>
</html>
