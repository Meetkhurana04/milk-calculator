<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doodh Hisaab</title>
  <style>
    :root {
      --bg: #F3F5F8;
      --card: #FFFFFF;
      --text: #22303F;
      --text-soft: #5C6B7E;
      --accent: #3E7CB1;
      --accent-dark: #2E5F8A;
      --accent-soft: #E8F1F8;
      --danger: #C0574A;
      --danger-soft: #FBEAE8;
      --border: #E2E7ED;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
      padding: 20px 16px 44px;
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.3rem;
      font-weight: 700;
    }

    .brand .emoji {
      font-size: 1.5rem;
    }

    .icon-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color .15s, transform .1s;
    }

    .icon-btn:hover {
      border-color: var(--accent);
    }

    .icon-btn:active {
      transform: scale(.95);
    }

    .icon-btn:focus-visible,
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent-dark);
      outline-offset: 2px;
    }

    .banner {
      background: var(--danger-soft);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: .88rem;
      margin-bottom: 14px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .section-title {
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--text-soft);
      font-weight: 700;
    }

    .link-btn {
      background: none;
      border: none;
      color: var(--accent-dark);
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      padding: 4px 0;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .presets-section {
      margin-bottom: 18px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 20px;
    }

    .chip {
      display: flex;
      align-items: stretch;
      background: var(--accent-soft);
      border-radius: 999px;
      overflow: hidden;
    }

    .chip-load {
      border: none;
      background: none;
      color: var(--accent-dark);
      padding: 7px 6px 7px 14px;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
    }

    .chip-del {
      border: none;
      background: none;
      color: var(--accent-dark);
      opacity: .55;
      padding: 7px 12px 7px 4px;
      cursor: pointer;
      font-size: .8rem;
    }

    .chip-del:hover {
      opacity: 1;
      color: var(--danger);
    }

    .empty-hint {
      color: var(--text-soft);
      font-size: .88rem;
      margin: 4px 0;
    }

    .milk-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 14px;
    }

    .milk-row {
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
      background: var(--bg);
    }

    .milk-row-top {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .milk-name {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }

    .remove-btn {
      width: 44px;
      flex-shrink: 0;
      border: 1.5px solid var(--border);
      background: var(--card);
      border-radius: 10px;
      color: var(--text-soft);
      font-size: 1.1rem;
      cursor: pointer;
    }

    .remove-btn:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .milk-row-bottom {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .field {
      flex: 1;
      min-width: 88px;
    }

    .field label {
      display: block;
      font-size: .72rem;
      color: var(--text-soft);
      margin-bottom: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .03em;
    }

    .field input {
      width: 100%;
      font-size: 1.05rem;
      padding: 11px 10px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
    }

    .field input:focus,
    .milk-name:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .subtotal-field .milk-subtotal {
      padding: 11px 10px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .btn-add {
      width: 100%;
      padding: 14px;
      border: 1.5px dashed var(--accent);
      background: var(--accent-soft);
      color: var(--accent-dark);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .btn-add:hover {
      background: #DFEBF5;
    }

    .total-section {
      background: var(--accent-soft);
      border-radius: var(--radius-sm);
      padding: 16px;
      margin-bottom: 16px;
    }

    .total-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .total-row span:first-child {
      font-size: .85rem;
      color: var(--accent-dark);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .total-row span:last-child {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent-dark);
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .actions-row button {
      flex: 1;
      min-width: 120px;
      padding: 14px;
      border-radius: 12px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-dark);
    }

    .btn-secondary {
      background: var(--card);
      color: var(--accent-dark);
      border-color: var(--accent);
    }

    .btn-secondary:hover {
      background: var(--accent-soft);
    }

    .btn-ghost-danger {
      background: var(--card);
      color: var(--danger);
      border-color: var(--border);
    }

    .btn-ghost-danger:hover {
      border-color: var(--danger);
      background: var(--danger-soft);
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(20, 30, 40, .45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 50;
    }

    .overlay.center {
      align-items: center;
      padding: 20px;
    }

    .panel-sheet {
      background: var(--card);
      width: 100%;
      max-width: 460px;
      border-radius: 20px 20px 0 0;
      padding: 18px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .modal-card {
      background: var(--card);
      width: 100%;
      max-width: 360px;
      border-radius: var(--radius);
      padding: 20px;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .panel-head h2 {
      font-size: 1.1rem;
      margin: 0;
    }

    .panel-close {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--text-soft);
    }

    #historyList {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .history-item {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .history-item-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: 700;
    }

    .history-total {
      color: var(--accent-dark);
      white-space: nowrap;
    }

    .history-date {
      font-size: .78rem;
      color: var(--text-soft);
      margin: 4px 0 8px;
    }

    .history-actions {
      display: flex;
      gap: 8px;
    }

    .tiny-btn,
    .tiny-btn-danger {
      border: 1.5px solid var(--border);
      background: var(--card);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: .82rem;
      cursor: pointer;
      font-weight: 700;
    }

    .tiny-btn {
      color: var(--accent-dark);
    }

    .tiny-btn:hover {
      border-color: var(--accent);
    }

    .tiny-btn-danger {
      color: var(--danger);
    }

    .tiny-btn-danger:hover {
      border-color: var(--danger);
    }

    .clear-history-row {
      margin-top: 12px;
      text-align: center;
      flex-shrink: 0;
    }

    .clear-history-row button {
      background: none;
      border: none;
      color: var(--danger);
      font-size: .85rem;
      cursor: pointer;
      font-weight: 600;
    }

    .modal-card h2 {
      margin-top: 0;
      font-size: 1.05rem;
    }

    .modal-card label {
      display: block;
      font-size: .85rem;
      color: var(--text-soft);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .modal-card input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .modal-card input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      border: 1.5px solid transparent;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="app-header">
      <div class="brand"><span class="emoji">🥛</span><span>Doodh Hisaab</span></div>
      <button id="historyBtn" class="icon-btn" title="History" aria-label="History kholein">🕒</button>
    </header>

    <div id="storageWarning" class="banner" hidden></div>

    <div class="card">
      <div class="presets-section">
        <div class="section-head">
          <span class="section-title">Presets</span>
          <button id="savePresetBtn" class="link-btn">+ Save current</button>
        </div>
        <div id="presetChips" class="chip-row"></div>
      </div>

      <div id="milkList" class="milk-list"></div>

      <button id="addMilkBtn" class="btn-add">➕ Add milk type</button>

      <div class="total-section">
        <div class="total-row">
          <span>Total</span>
          <span id="totalDisplay">₹0.00</span>
        </div>
      </div>

      <div class="actions-row">
        <button id="shareBtn" class="btn-primary">📤 WhatsApp pe share</button>
        <button id="saveHistoryBtn" class="btn-secondary">💾 Save</button>
        <button id="clearBtn" class="btn-ghost-danger">🔄 Clear</button>
      </div>
    </div>
  </div>

  <div id="historyOverlay" class="overlay" hidden>
    <div class="panel-sheet">
      <div class="panel-head">
        <h2>History</h2>
        <button id="closeHistoryBtn" class="panel-close" aria-label="Band karein">✕</button>
      </div>
      <div id="historyList"></div>
      <div class="clear-history-row">
        <button id="clearHistoryBtn">Poori history delete karein</button>
      </div>
    </div>
  </div>

  <div id="nameOverlay" class="overlay center" hidden>
    <div class="modal-card">
      <h2 id="nameModalTitle">Naam</h2>
      <label for="nameModalInput">Naam likhein</label>
      <input type="text" id="nameModalInput" placeholder="e.g. Shop A - Monday">
      <div class="modal-actions">
        <button id="nameModalCancel" class="btn-ghost-danger"
          style="color:var(--text-soft);border-color:var(--border);">Cancel</button>
        <button id="nameModalSave" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      let milkTypes = [];
      let idCounter = 1;
      let pendingModalAction = null;

      const milkListEl = document.getElementById('milkList');
      const totalDisplay = document.getElementById('totalDisplay');
      const addMilkBtn = document.getElementById('addMilkBtn');
      const shareBtn = document.getElementById('shareBtn');
      const saveHistoryBtn = document.getElementById('saveHistoryBtn');
      const clearBtn = document.getElementById('clearBtn');
      const savePresetBtn = document.getElementById('savePresetBtn');
      const presetChips = document.getElementById('presetChips');
      const historyBtn = document.getElementById('historyBtn');
      const historyOverlay = document.getElementById('historyOverlay');
      const historyList = document.getElementById('historyList');
      const closeHistoryBtn = document.getElementById('closeHistoryBtn');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const nameOverlay = document.getElementById('nameOverlay');
      const nameModalTitle = document.getElementById('nameModalTitle');
      const nameModalInput = document.getElementById('nameModalInput');
      const nameModalSave = document.getElementById('nameModalSave');
      const nameModalCancel = document.getElementById('nameModalCancel');
      const storageWarning = document.getElementById('storageWarning');

      function uid() { return 'id' + (idCounter++) + '-' + Date.now().toString(36); }
      function genRow(name, rate, qty) { return { id: uid(), name: name || '', rate: rate || '', qty: qty || '' }; }
      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }
      function subtotal(m) { return (parseFloat(m.rate) || 0) * (parseFloat(m.qty) || 0); }

      function addMilkType(name, rate) {
        milkTypes.push(genRow(name, rate, ''));
        renderMilkList();
      }
      function removeMilkType(id) {
        milkTypes = milkTypes.filter(m => m.id !== id);
        renderMilkList();
      }

      function renderMilkList() {
        if (milkTypes.length === 0) {
          milkListEl.innerHTML = '<p class="empty-hint">Abhi koi milk type nahi hai. Neeche se add karein 👇</p>';
          updateTotal();
          return;
        }
        milkListEl.innerHTML = milkTypes.map(m => `
      <div class="milk-row" data-id="${m.id}">
        <div class="milk-row-top">
          <input type="text" class="milk-name" data-field="name" placeholder="Milk ka naam" value="${escapeHtml(m.name)}">
          <button class="remove-btn" data-action="remove" aria-label="Remove" title="Remove">✕</button>
        </div>
        <div class="milk-row-bottom">
          <div class="field">
            <label>Rate ₹/L</label>
            <input type="number" class="milk-rate" data-field="rate" inputmode="decimal" step="0.1" min="0" placeholder="0" value="${m.rate}">
          </div>
          <div class="field">
            <label>Qty (L)</label>
            <input type="number" class="milk-qty" data-field="qty" inputmode="decimal" step="0.1" min="0" placeholder="0" value="${m.qty}">
          </div>
          <div class="field subtotal-field">
            <label>Subtotal</label>
            <div class="milk-subtotal">₹${subtotal(m).toFixed(2)}</div>
          </div>
        </div>
      </div>
    `).join('');
        updateTotal();
      }

      function updateTotal() {
        const total = milkTypes.reduce((s, m) => s + subtotal(m), 0);
        totalDisplay.textContent = `₹${total.toFixed(2)}`;
      }

      milkListEl.addEventListener('input', (e) => {
        const row = e.target.closest('.milk-row');
        const field = e.target.dataset.field;
        if (!row || !field) return;
        const m = milkTypes.find(x => x.id === row.dataset.id);
        if (!m) return;
        m[field] = e.target.value;
        if (field === 'rate' || field === 'qty') {
          row.querySelector('.milk-subtotal').textContent = `₹${subtotal(m).toFixed(2)}`;
          updateTotal();
        }
      });
      milkListEl.addEventListener('click', (e) => {
        if (e.target.dataset.action === 'remove') {
          removeMilkType(e.target.closest('.milk-row').dataset.id);
        }
      });

      addMilkBtn.addEventListener('click', () => addMilkType());

      clearBtn.addEventListener('click', async () => {
        if (milkTypes.length === 0) return;
        const hasData = milkTypes.some(m => parseFloat(m.qty) > 0);
        if (hasData) {
          await saveToHistory(null, true);
        }
        milkTypes.forEach(m => m.qty = '');
        renderMilkList();
      });

      saveHistoryBtn.addEventListener('click', () => {
        if (milkTypes.length === 0 || !milkTypes.some(m => parseFloat(m.qty) > 0)) {
          alert('Pehle kuch quantity daalein, phir save karein.');
          return;
        }
        openNameModal('save-history');
      });
      savePresetBtn.addEventListener('click', () => {
        if (milkTypes.length === 0) { alert('Pehle kuch milk types add karein.'); return; }
        openNameModal('save-preset');
      });

      function openNameModal(action) {
        pendingModalAction = action;
        nameModalTitle.textContent = action === 'save-preset' ? 'Preset ka naam' : 'Is hisaab ka naam';
        nameModalInput.value = '';
        nameOverlay.hidden = false;
        nameModalInput.focus();
      }
      nameModalCancel.addEventListener('click', () => { nameOverlay.hidden = true; });
      nameOverlay.addEventListener('click', (e) => { if (e.target === nameOverlay) nameOverlay.hidden = true; });
      nameModalInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameModalSave.click(); });
      nameModalSave.addEventListener('click', async () => {
        const name = nameModalInput.value.trim();
        if (!name) { nameModalInput.focus(); return; }
        nameOverlay.hidden = true;
        if (pendingModalAction === 'save-history') await saveToHistory(name, false);
        else if (pendingModalAction === 'save-preset') await savePreset(name);
      });

      function readList(key) {
        try {
          const raw = localStorage.getItem(key);
          return raw ? JSON.parse(raw) : [];
        } catch (e) { return []; }
      }
      function writeList(key, list) {
        try { localStorage.setItem(key, JSON.stringify(list)); }
        catch (e) { console.error('storage write failed', key, e); }
      }

      async function saveToHistory(name, isAuto) {
        const list = readList('history');
        list.unshift({
          id: uid(),
          name: name || null,
          auto: !!isAuto,
          items: milkTypes.map(m => ({ name: m.name, rate: m.rate, qty: m.qty })),
          total: milkTypes.reduce((s, m) => s + subtotal(m), 0),
          timestamp: Date.now()
        });
        await writeList('history', list.slice(0, 100));
      }

      async function savePreset(name) {
        const list = readList('presets');
        list.unshift({
          id: uid(), name,
          items: milkTypes.map(m => ({ name: m.name, rate: m.rate })),
          createdAt: Date.now()
        });
        await writeList('presets', list);
        await refreshPresetChips();
      }

      async function refreshPresetChips() {
        const list = readList('presets');
        if (list.length === 0) {
          presetChips.innerHTML = '<span class="empty-hint">Rate presets yahin dikhenge</span>';
          return;
        }
        presetChips.innerHTML = list.map(p => `
      <span class="chip">
        <button class="chip-load" data-load="${p.id}">${escapeHtml(p.name)}</button>
        <button class="chip-del" data-del="${p.id}" aria-label="Preset delete karein">✕</button>
      </span>
    `).join('');
      }
      presetChips.addEventListener('click', async (e) => {
        const loadId = e.target.dataset.load;
        const delId = e.target.dataset.del;
        if (loadId) {
          const list = await readList('presets');
          const preset = list.find(p => p.id === loadId);
          if (preset) {
            milkTypes = preset.items.map(it => genRow(it.name, it.rate, ''));
            renderMilkList();
          }
        } else if (delId) {
          if (!confirm('Yeh preset delete karna hai?')) return;
          const list = (await readList('presets')).filter(p => p.id !== delId);
          await writeList('presets', list);
          await refreshPresetChips();
        }
      });

      historyBtn.addEventListener('click', async () => {
        historyOverlay.hidden = false;
        await renderHistoryList();
      });
      closeHistoryBtn.addEventListener('click', () => { historyOverlay.hidden = true; });
      historyOverlay.addEventListener('click', (e) => { if (e.target === historyOverlay) historyOverlay.hidden = true; });

      async function renderHistoryList() {
        const list = readList('history');
        if (list.length === 0) {
          historyList.innerHTML = '<p class="empty-hint">Abhi koi history nahi hai.</p>';
          return;
        }
        historyList.innerHTML = list.map(h => `
      <div class="history-item">
        <div class="history-item-top">
          <span>${h.name ? escapeHtml(h.name) : 'Auto-saved'}</span>
          <span class="history-total">₹${h.total.toFixed(2)}</span>
        </div>
        <div class="history-date">${new Date(h.timestamp).toLocaleString('en-IN')}</div>
        <div class="history-actions">
          <button data-hist-load="${h.id}" class="tiny-btn">Load</button>
          <button data-hist-del="${h.id}" class="tiny-btn-danger">Delete</button>
        </div>
      </div>
    `).join('');
      }
      historyList.addEventListener('click', async (e) => {
        const loadId = e.target.dataset.histLoad;
        const delId = e.target.dataset.histDel;
        if (loadId) {
          const list = await readList('history');
          const h = list.find(x => x.id === loadId);
          if (h) {
            milkTypes = h.items.map(it => genRow(it.name, it.rate, it.qty));
            renderMilkList();
            historyOverlay.hidden = true;
          }
        } else if (delId) {
          if (!confirm('Delete karna hai?')) return;
          const list = (await readList('history')).filter(x => x.id !== delId);
          await writeList('history', list);
          await renderHistoryList();
        }
      });
      clearHistoryBtn.addEventListener('click', async () => {
        if (!confirm('Poori history delete karni hai?')) return;
        await writeList('history', []);
        await renderHistoryList();
      });

      shareBtn.addEventListener('click', () => {
        const withQty = milkTypes.filter(m => parseFloat(m.qty) > 0);
        if (withQty.length === 0) { alert('Pehle quantity daalein.'); return; }
        const lines = withQty.map(m => `${m.name || 'Milk'}: ${m.qty}L x ₹${m.rate} = ₹${subtotal(m).toFixed(2)}`);
        const total = milkTypes.reduce((s, m) => s + subtotal(m), 0);
        const dateStr = new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
        const text = `🥛 Doodh Hisaab - ${dateStr}\n\n${lines.join('\n')}\n\n———————————\nTotal: ₹${total.toFixed(2)}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
      });

      refreshPresetChips();
      addMilkType('', '');
      renderMilkList();
    })();
  </script>
</body>

</html>
